name: Run Gradle Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Gradle command arguments (without ./gradlew)"
        required: true
        type: string
        default: "runTestsInCI --continue"

      is_test:
        description: "Set ANDROIDIDE_TEST=true"
        required: false
        type: boolean
        default: false

      stacktrace:
        description: "Add --stacktrace"
        required: false
        type: boolean
        default: false

      info:
        description: "Add --info"
        required: false
        type: boolean
        default: false

      debug:
        description: "Add --debug"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: Run Gradle Command
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run command
        env:
          GRADLE_COMMAND: ${{ inputs.command }}
          IS_TEST: ${{ inputs.is_test }}
          STACKTRACE: ${{ inputs.stacktrace }}
          INFO: ${{ inputs.info }}
          DEBUG: ${{ inputs.debug }}
        run: |
          read -r -a args <<< "$GRADLE_COMMAND"

          if [ "$STACKTRACE" = "true" ]; then
            args+=(--stacktrace)
          fi

          if [ "$INFO" = "true" ]; then
            args+=(--info)
          fi

          if [ "$DEBUG" = "true" ]; then
            args+=(--debug)
          fi

          if [ "$IS_TEST" = "true" ]; then
            export ANDROIDIDE_TEST=true
          fi

          printf 'Running: ./gradlew'
          printf ' %q' "${args[@]}"
          printf '\n'

          if [ "$IS_TEST" = "true" ]; then
            echo "ANDROIDIDE_TEST=true"
          fi

          ./gradlew "${args[@]}"