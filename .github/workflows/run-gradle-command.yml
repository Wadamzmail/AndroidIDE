name: Run Gradle Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Gradle command arguments (without ./gradlew)"
        required: true
        type: string
        default: ":core:indexing-api:dependencyInsight --dependency kotlin-android-extensions-runtime --configuration debugAndroidTestRuntimeClasspath"

      stacktrace:
        description: "Add --stacktrace"
        required: false
        type: boolean
        default: false

      info:
        description: "Add --info"
        required: false
        type: boolean
        default: false

      debug:
        description: "Add --debug"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: Run Gradle Command
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run command
        env:
          GRADLE_COMMAND: ${{ inputs.command }}
          STACKTRACE: ${{ inputs.stacktrace }}
          INFO: ${{ inputs.info }}
          DEBUG: ${{ inputs.debug }}
        run: |
          read -r -a args <<< "$GRADLE_COMMAND"

          if [ "$STACKTRACE" = "true" ]; then
            args+=(--stacktrace)
          fi

          if [ "$INFO" = "true" ]; then
            args+=(--info)
          fi

          if [ "$DEBUG" = "true" ]; then
            args+=(--debug)
          fi

          printf 'Running: ./gradlew'
          printf ' %q' "${args[@]}"
          printf '\n'

          ./gradlew "${args[@]}"